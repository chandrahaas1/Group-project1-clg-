<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Physics Around Us — Conservation Laws Virtual Lab</title>
  <style>
    :root {
      --bg: #0b0f19;
      --panel: #131a2a;
      --panel-border: #23304d;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --block1: #3b82f6;
      --block2: #f97316;
      --green: #22c55e;
      --red: #ef4444;
      --purple: #a855f7;
      --yellow: #facc15;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: linear-gradient(90deg, #0f172a, #1e293b);
      border-bottom: 1px solid var(--panel-border);
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    header h1 {
      font-size: 1.2rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.3px;
    }

    header h1 span { color: var(--accent); }

    .quick-jumps {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .jump-btn {
      padding: 7px 14px;
      border-radius: 7px;
      border: 1px solid var(--panel-border);
      background: #0b1120;
      color: var(--accent);
      font-weight: 700;
      font-size: 0.8rem;
      text-decoration: none;
      transition: all 0.2s;
    }

    .jump-btn:hover {
      background: rgba(56, 189, 248, 0.15);
      border-color: var(--accent);
    }

    .stack-container {
      display: flex;
      flex-direction: column;
      gap: 24px;
      padding: 16px;
    }

    .lab-section {
      background: rgba(15, 23, 42, 0.55);
      border: 1px solid var(--panel-border);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .section-banner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--panel-border);
    }

    .section-banner h2 {
      font-size: 1.05rem;
      color: #fff;
    }

    .section-banner .pill {
      background: rgba(56, 189, 248, 0.14);
      border: 1px solid rgba(56, 189, 248, 0.35);
      color: var(--accent);
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 0.76rem;
      font-weight: 700;
    }

    .main-grid {
      display: grid;
      grid-template-columns: 330px 1fr 340px;
      gap: 14px;
    }
    @media (max-width: 1150px) {
      .main-grid { grid-template-columns: 1fr; }
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .card h3 {
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--accent);
      border-bottom: 1px solid var(--panel-border);
      padding-bottom: 8px;
    }

    .control-group { display: flex; flex-direction: column; gap: 6px; }
    .control-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
    }
    .control-header label { color: var(--text); font-weight: 500; }
    .control-header span { color: var(--accent); font-family: monospace; font-weight: 700; }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .preset-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }
    .preset-row.two-col { grid-template-columns: 1fr 1fr; }

    .preset-btn {
      padding: 7px 6px;
      border-radius: 7px;
      border: 1px solid var(--panel-border);
      background: #0f172a;
      color: var(--muted);
      font-weight: 600;
      font-size: 0.76rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .preset-btn.active {
      background: rgba(56, 189, 248, 0.2);
      border-color: var(--accent);
      color: #fff;
    }

    .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    button.action {
      padding: 10px 12px;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s;
    }
    button.action:active { transform: scale(0.97); }
    .btn-play { background: var(--green); color: #fff; grid-column: span 2; font-size: 0.92rem; }
    .btn-play.paused { background: var(--block2); }
    .btn-slow { background: var(--purple); color: #fff; }
    .btn-reset { background: #334155; color: #fff; }
    .btn-record { background: rgba(34, 197, 94, 0.18); border: 1px solid var(--green) !important; color: #4ade80; grid-column: span 2; }

    .formula-box {
      background: #0b1120;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 0.82rem;
      line-height: 1.5;
      color: var(--muted);
    }
    .formula-box strong { color: #fff; }
    .eq {
      font-family: 'Cambria Math', 'Times New Roman', serif;
      font-size: 0.96rem;
      color: var(--accent);
      text-align: center;
      margin: 6px 0;
      background: rgba(56, 189, 248, 0.08);
      padding: 6px;
      border-radius: 6px;
    }

    .sim-container {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    canvas.sim-canvas {
      width: 100%;
      height: 410px;
      background: #060913;
      border-radius: 12px;
      border: 1px solid var(--panel-border);
      display: block;
    }

    .hud-overlay {
      position: absolute;
      top: 14px;
      left: 14px;
      background: rgba(11, 15, 25, 0.85);
      backdrop-filter: blur(4px);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 0.8rem;
      line-height: 1.5;
      pointer-events: none;
    }

    .legend {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      font-size: 0.78rem;
      color: var(--muted);
      justify-content: center;
    }
    .legend span { display: flex; align-items: center; gap: 6px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .stat-box {
      background: #0b1120;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 8px 10px;
    }
    .stat-label { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; }
    .stat-val { font-size: 1.02rem; font-weight: 700; font-family: monospace; margin-top: 2px; }

    .bar-card {
      background: #0b1120;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .bar-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.78rem;
    }
    .stacked-bar {
      height: 18px;
      background: #1e293b;
      border-radius: 9px;
      overflow: hidden;
      display: flex;
    }
    .seg-1 { background: var(--block1); height: 100%; transition: width 0.08s linear; }
    .seg-2 { background: var(--block2); height: 100%; transition: width 0.08s linear; }
    .seg-lost { background: rgba(239, 68, 68, 0.35); height: 100%; transition: width 0.08s linear; }

    .bar-sub {
      display: flex;
      justify-content: space-between;
      font-family: monospace;
      font-size: 0.75rem;
    }

    table.summary-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.78rem;
      background: #0b1120;
      border-radius: 8px;
      overflow: hidden;
    }
    table.summary-table th, table.summary-table td {
      padding: 7px 8px;
      border: 1px solid #1e293b;
      text-align: center;
      font-family: monospace;
    }
    table.summary-table th {
      background: #162033;
      color: var(--accent);
      font-family: sans-serif;
      font-weight: 600;
    }
  </style>
</head>
<body>

<header>
  <h1>Physics Around Us: <span>Conservation Laws Virtual e-Lab</span></h1>
  <div class="quick-jumps">
    <a class="jump-btn" href="#section-angular">Top: Angular Momentum</a>
    <a class="jump-btn" href="#section-linear">Bottom: Linear Momentum</a>
  </div>
</header>

<div class="stack-container">

  <!-- ===================================================================== -->
  <!-- TOP SECTION: CONSERVATION OF ANGULAR MOMENTUM                         -->
  <!-- ===================================================================== -->
  <section id="section-angular" class="lab-section">
    <div class="section-banner">
      <h2>Part 1: Conservation of Angular Momentum</h2>
      <span class="pill">L = I&omega; = const</span>
    </div>

    <div class="main-grid">
      <!-- LEFT: CONTROLS -->
      <div class="card">
        <h3>1. Rotating Rod Setup</h3>

        <div class="control-group">
          <div class="control-header">
            <label style="color:#fb923c">Weight Distance from Axis (r)</label>
            <span id="angRVal">1.00 m</span>
          </div>
          <input type="range" id="angRSlider" min="0.30" max="1.20" step="0.02" value="1.00" />
        </div>

        <div class="control-group">
          <div class="control-header">
            <label style="color:#60a5fa">Mass per Sliding Weight (m)</label>
            <span id="angMVal">0.50 kg</span>
          </div>
          <input type="range" id="angMSlider" min="0.20" max="1.50" step="0.05" value="0.50" />
        </div>

        <div class="control-group">
          <div class="control-header">
            <label>Quick Radius Presets</label>
            <span>Compare I &amp; &omega;</span>
          </div>
          <div class="preset-row two-col">
            <button class="preset-btn active" id="angBtnLong" onclick="angSetCase('long')">Case 1: Long (r = 1.00 m)</button>
            <button class="preset-btn" id="angBtnShort" onclick="angSetCase('short')">Case 2: Short (r = 0.40 m)</button>
          </div>
        </div>

        <div class="btn-group">
          <button class="action btn-play paused" id="angPlayBtn" onclick="angTogglePlay()">PAUSE ROTATION</button>
          <button class="action btn-slow" onclick="angAnimateSlide()">Animate Slide (r&#8321; &rarr; r&#8322;)</button>
          <button class="action btn-reset" onclick="angReset()">Reset Lab</button>
          <button class="action btn-record" onclick="angRecordTrial()">Record Trial to Log</button>
        </div>

        <div class="formula-box">
          <strong>Core Governing Equations:</strong>
          <div class="eq">I = I<sub>0</sub> + 2mr<sup>2</sup></div>
          <div class="eq">L = I
